name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EmployeeMonitoringBE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: EmployeeMonitoringBE/requirements*.txt
      # ML libraries (OpenCV, dlib, ultralytics) are stubbed in the tests
      - run: pip install -r requirements-dev.txt
      - run: ruff check flaskr tests
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EmployeeMonitoringFE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: EmployeeMonitoringFE/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
