server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 10m;

    # API on the same origin: no CORS, and HTTP/2 can be enabled here in front of everything
    location /api/ {
        proxy_pass http://api:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        # MJPEG and Server-Sent Events must be passed through as they are produced
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # WebRTC signalling (WHEP) to the MediaMTX relay; the video itself goes over UDP/TCP 8189
    location /media/ {
        proxy_pass http://mediamtx:8889/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }

    # Client-side routing
    location / {
        try_files $uri /index.html;
    }
}
